<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satellite Telemetry - Anomaly Detection & Forecasting</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #dc2626 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #ffffff 0%, #f3f4f6 100%);
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #1e3a8a;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #667eea;
        }

        .stat-card.warning {
            border-left-color: #f59e0b;
        }

        .stat-card.danger {
            border-left-color: #ef4444;
        }

        .stat-label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-card.danger .stat-value {
            color: #ef4444;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 1024px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .panel-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .telemetry-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            color: #333;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .alert.danger {
            background: #fee;
            color: #c33;
            border-left: 4px solid #c33;
        }

        .alert.success {
            background: #efe;
            color: #3c3;
            border-left: 4px solid #3c3;
        }

        .alert.warning {
            background: #ffeaa7;
            color: #d63031;
            border-left: 4px solid #d63031;
        }

        .anomaly-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .anomaly-badge.true {
            background: #fee;
            color: #c33;
        }

        .anomaly-badge.false {
            background: #efe;
            color: #3c3;
        }

        .telemetry-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .telemetry-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }

        .telemetry-item:last-child {
            border-bottom: none;
        }

        .timestamp {
            color: #999;
            font-size: 11px;
        }

        .loading {
            color: #999;
            font-style: italic;
        }

        .forecast-card {
            background: #f9fafb;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            border-left: 4px solid #3b82f6;
        }

        .forecast-item {
            padding: 10px 0;
            border-bottom: 1px solid #e5e7eb;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 10px;
        }

        .forecast-item:last-child {
            border-bottom: none;
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 20px;
        }

        .feature-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .feature-btn {
            padding: 8px 15px;
            background: #e5e7eb;
            color: #333;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .feature-btn.active {
            background: #667eea;
            color: white;
        }

        .feature-btn:hover {
            background: #d1d5db;
        }

        .feature-btn.active:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const API_BASE = 'http://localhost:8000';

        function Dashboard() {
            const [stats, setStats] = useState(null);
            const [anomalies, setAnomalies] = useState([]);
            const [loading, setLoading] = useState({});
            const [message, setMessage] = useState(null);
            const [forecast, setForecast] = useState(null);
            const [selectedFeature, setSelectedFeature] = useState('bus_voltage');
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            const [formData, setFormData] = useState({
                battery_voltage: 12.5,
                bus_voltage: 5.0,
                wheel_rpm: 150,
                current: 2.3,
                wheel_temperature: 45.2
            });

            useEffect(() => {
                fetchStats();
                fetchAnomalies();
                fetchForecast('bus_voltage');

                const interval = setInterval(() => {
                    fetchStats();
                    fetchAnomalies();
                }, 5000);

                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                if (forecast && chartRef.current) {
                    updateChart();
                }
            }, [forecast]);

            useEffect(() => {
                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                        chartInstance.current = null;
                    }
                };
            }, []);

            const fetchStats = async () => {
                try {
                    const res = await fetch(`${API_BASE}/api/stats`);
                    const data = await res.json();
                    setStats(data);
                } catch (err) {
                    console.error('Error fetching stats:', err);
                }
            };

            const fetchAnomalies = async () => {
                try {
                    const res = await fetch(`${API_BASE}/api/anomalies?limit=10`);
                    const data = await res.json();
                    setAnomalies(data.data || []);
                } catch (err) {
                    console.error('Error fetching anomalies:', err);
                }
            };

            const fetchForecast = async (feature) => {
                try {
                    const res = await fetch(`${API_BASE}/api/forecast?feature=${feature}&periods=48`, {
                        method: 'POST'
                    });

                    if (!res.ok) {
                        throw new Error('Forecast request failed');
                    }

                    const data = await res.json();

                    if (!Array.isArray(data.data)) {
                        throw new Error('Invalid forecast response');
                    }

                    setForecast({ forecast_data: data.data });
                } catch (err) {
                    console.error('Error fetching forecast:', err);
                    setForecast(null);
                    setMessage({ type: 'warning', text: 'Forecast unavailable - train models first' });
                }
            };

            const updateChart = () => {
                if (!forecast || !chartRef.current) return;

                const ctx = chartRef.current.getContext('2d');

                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                const forecastData = Array.isArray(forecast?.forecast_data) ? forecast.forecast_data : [];
                if (forecastData.length === 0) return;

                const labels = forecastData.map(d => new Date(d.timestamp).getHours() + ':00');
                const forecasts = forecastData.map(d => d.forecast);
                const lower = forecastData.map(d => d.lower_bound);
                const upper = forecastData.map(d => d.upper_bound);

                chartInstance.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Forecast',
                                data: forecasts,
                                borderColor: '#3b82f6',
                                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                borderWidth: 2,
                                tension: 0.3,
                                fill: false
                            },
                            {
                                label: 'Upper Bound',
                                data: upper,
                                borderColor: '#ef4444',
                                borderDash: [5, 5],
                                borderWidth: 1,
                                fill: false
                            },
                            {
                                label: 'Lower Bound',
                                data: lower,
                                borderColor: '#10b981',
                                borderDash: [5, 5],
                                borderWidth: 1,
                                fill: false
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'top',
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: false
                            }
                        }
                    }
                });
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading({...loading, submit: true});

                try {
                    const res = await fetch(`${API_BASE}/api/telemetry`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });

                    if (!res.ok) throw new Error('Submit failed');

                    const result = await res.json();

                    if (result.is_anomaly) {
                        setMessage({
                            type: 'danger',
                            text: `🚨 ANOMALY DETECTED! Confidence: ${(result.confidence * 100).toFixed(1)}% | Method: ${result.detection_method}`
                        });
                    } else {
                        setMessage({
                            type: 'success',
                            text: '✓ Data submitted successfully - No anomaly detected'
                        });
                    }

                    setTimeout(() => setMessage(null), 5000);
                    fetchStats();
                    fetchAnomalies();
                } catch (err) {
                    setMessage({ type: 'danger', text: '❌ Error submitting data' });
                } finally {
                    setLoading({...loading, submit: false});
                }
            };

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData({...formData, [name]: parseFloat(value)});
            };

            const handleTrain = async () => {
                setLoading({...loading, train: true});
                try {
                    const res = await fetch(`${API_BASE}/api/train`, { method: 'POST' });
                    const result = await res.json();
                    setMessage({
                        type: 'success',
                        text: `✓ ${result.message}`
                    });
                    setTimeout(() => setMessage(null), 3000);
                    fetchForecast(selectedFeature);
                } catch (err) {
                    setMessage({ type: 'danger', text: '❌ Training failed' });
                } finally {
                    setLoading({...loading, train: false});
                }
            };

            const handleFeatureChange = (feature) => {
                setSelectedFeature(feature);
                fetchForecast(feature);
            };

            return (
                <div className="container">
                    <header>
                        <h1>🛰️ Satellite Telemetry - Anomaly Detection & Forecasting</h1>
                        <p className="subtitle">Real-time ensemble anomaly detection (Isolation Forest + LSTM) with Prophet forecasting</p>
                    </header>

                    {message && (
                        <div className={`alert ${message.type}`}>
                            {message.text}
                        </div>
                    )}

                    <div className="stats-grid">
                        <div className={`stat-card ${stats?.anomaly_count > 0 ? 'danger' : ''}`}>
                            <div className="stat-label">Total Records</div>
                            <div className="stat-value">{stats?.total_records || 0}</div>
                        </div>
                        <div className={`stat-card ${stats?.anomaly_count > 5 ? 'danger' : 'warning'}`}>
                            <div className="stat-label">🚨 Anomalies Detected</div>
                            <div className="stat-value">{stats?.anomaly_count || 0}</div>
                            <div style={{marginTop: '8px', fontSize: '12px', color: '#666'}}>
                                {stats?.anomaly_percentage?.toFixed(2)}% of records
                            </div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-label">Detection Method</div>
                            <div style={{fontSize: '14px', color: '#667eea', fontWeight: 'bold'}}>
                                Ensemble (IF + LSTM)
                            </div>
                        </div>
                    </div>

                    <div className="content-grid">
                        <div className="panel">
                            <div className="panel-title">📊 Telemetry Input</div>
                            <form className="telemetry-form" onSubmit={handleSubmit}>
                                <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px'}}>
                                    {Object.keys(formData).map(key => (
                                        <div className="form-group" key={key}>
                                            <label>{key.replace(/_/g, ' ')}</label>
                                            <input
                                                type="number"
                                                step="0.1"
                                                name={key}
                                                value={formData[key]}
                                                onChange={handleInputChange}
                                            />
                                        </div>
                                    ))}
                                </div>
                                <button type="submit" disabled={loading.submit}>
                                    {loading.submit ? '⏳ Analyzing...' : '🔍 Submit & Analyze'}
                                </button>
                                <button type="button" onClick={handleTrain} disabled={loading.train}>
                                    {loading.train ? '⏳ Training...' : '🧠 Train Prophet Models'}
                                </button>
                            </form>
                        </div>

                        <div className="panel">
                            <div className="panel-title">🚨 Recent Anomalies</div>
                            <div className="telemetry-list">
                                {anomalies.length === 0 ? (
                                    <p className="loading">✓ No anomalies detected recently</p>
                                ) : (
                                    anomalies.map((item, idx) => (
                                        <div className="telemetry-item" key={idx}>
                                            <div style={{marginBottom: '5px', display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                                                <span className="anomaly-badge true">🚨 ANOMALY</span>
                                                <span style={{fontWeight: 'bold', color: '#ef4444'}}>
                                                    {(item.confidence * 100).toFixed(1)}% confidence
                                                </span>
                                            </div>
                                            <div className="timestamp">
                                                {new Date(item.timestamp).toLocaleString()}
                                            </div>
                                        </div>
                                    ))
                                )}</div>
                        </div>
                    </div>

                    <div className="panel">
                        <div className="panel-title">📈 Anomaly Trend Forecast (Predict When Anomalies May Happen)</div>
                        <div style={{marginBottom: '15px'}}>
                            <label style={{marginRight: '20px', color: '#333', fontWeight: 'bold'}}>Select Feature to Forecast:</label>
                            <div className="feature-buttons">
                                {['battery_voltage', 'bus_voltage', 'wheel_rpm', 'current', 'wheel_temperature'].map(feature => (
                                    <button
                                        key={feature}
                                        className={`feature-btn ${selectedFeature === feature ? 'active' : ''}`}
                                        onClick={() => handleFeatureChange(feature)}
                                    >
                                        {feature.replace(/_/g, ' ')}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {forecast ? (
                            <>
                                <div className="chart-container">
                                    <canvas ref={chartRef}></canvas>
                                </div>
                                <div className="forecast-card">
                                    <strong>📊 Next 24 Hours Predictions ({selectedFeature.replace(/_/g, ' ')}):</strong>
                                    <div style={{marginTop: '10px', maxHeight: '250px', overflowY: 'auto'}}>
                                        {forecast.forecast_data.slice(0, 12).map((item, idx) => (
                                            <div className="forecast-item" key={idx}>
                                                <div style={{fontWeight: 'bold'}}>{new Date(item.timestamp).toLocaleTimeString()}</div>
                                                <div style={{fontSize: '12px', color: '#666'}}>
                                                    Forecast: <strong>{item.forecast.toFixed(2)}</strong> {' | Range: ' + item.lower_bound.toFixed(2) + ' - ' + item.upper_bound.toFixed(2)}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </>
                        ) : (
                            <p className="loading">⏳ Train models to see forecasts (click 'Train Prophet Models')</p>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Dashboard />, document.getElementById('root'));
    </script>
</body>
</html>
